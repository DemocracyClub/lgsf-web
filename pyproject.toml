[project]
name = "lgsf-web"
version = "0.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "boto3==1.43.112",
    "cryptography==50.0.2",
    "fonttools==4.67.0",
    "django==5.2.18",
    "modelsearch==1.3.2",
    "pgvector==0.5.1",
    "python-dotenv==1.2.2",
    "psycopg[binary]==3.3.6",
    "pypdf==6.20.1",
    "requests==2.34.2",
    "dc-django-utils",
    "django-filter==26.2",
    "dc-name-matching",
]

[dependency-groups]
cdk = [
    "aws-cdk-lib==2.253.0",
    "boto3==1.43.112",
    "constructs==10.5.0",
]
production = [
    "gunicorn[gevent]==26.2.0",
    "sentry-sdk==2.71.0",
    "gevent==26.9.0",
]
dev = [
    "django-debug-toolbar==8.0.0",
    "ruff==0.16.10",
    "djhtml==3.0.11",
    "pytest==9.0.3",
    "pytest-django==4.11.1",
]
# For manage.py embed_documents. Not installed on the web servers.
# docling-core (which chunks) and docling-parse (which reads PDFs) are
# pinned to the versions the test fixtures were made with.
embeddings = [
    "docling==2.130.0",
    "docling-core==2.96.0",
    "docling-parse==7.21.0",
    "rapidocr==3.9.2",
    "torch==2.14.1",
    "torchvision==0.29.1",
]
# The same, with torch and torchvision from PyPI, whose Linux wheels are
# CUDA builds that bring the CUDA libraries with them as nvidia-*
# packages. For Dockerfile.embeddings, to run on GPU instances.
embeddings-gpu = [
    "docling==2.130.0",
    "docling-core==2.96.0",
    "docling-parse==7.21.0",
    "rapidocr==3.9.2",
    "torch==2.14.1",
    "torchvision==0.29.1",
]

[tool.uv.sources]
dc-django-utils = { git = "https://github.com/DemocracyClub/dc_django_utils.git", tag = "8.0.5" }
dc-name-matching = { git = "https://github.com/DemocracyClub/dc-name-matching" }
# torch from PyPI is the CUDA build on Linux, which brings several GB of
# NVIDIA libraries. The embeddings group runs on CPU, so it takes torch
# from PyTorch's CPU-only index instead. torchvision, which Docling
# needs, has to come from the same index, to be built against the same
# torch.
torch = [{ index = "pytorch-cpu", group = "embeddings" }]
torchvision = [{ index = "pytorch-cpu", group = "embeddings" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
package = false
required-version = "==0.11.*"
environments = [
    "platform_python_implementation == 'CPython'"
]
# Each takes torch from its own index, so only one can be installed.
conflicts = [
    [{ group = "embeddings" }, { group = "embeddings-gpu" }],
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "lgsf_web.settings.testing"
testpaths = ["lgsf_web"]
norecursedirs = ["static", "node_modules", ".venv", ".git", "cdk.out"]

[tool.ruff]
line-length = 80
extend-exclude = ["lgsf_web/settings/local.py"]

[tool.ruff.lint]
ignore = ["E501"]
extend-select = [
    "I",
    "C4",
    "SIM",
    "Q003",
    "RET",
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["RUF012"]
