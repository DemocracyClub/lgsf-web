[project]
name = "lgsf-web"
version = "0.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "boto3==1.43.112",
    "cryptography==50.0.2",
    "django==5.2.18",
    "modelsearch==1.3.2",
    "python-dotenv==1.2.2",
    "psycopg[binary]==3.3.6",
    "pypdf==6.20.1",
    "requests==2.34.2",
    "dc-django-utils",
]

[dependency-groups]
cdk = [
    "aws-cdk-lib==2.253.0",
    "boto3==1.43.112",
    "constructs==10.5.0",
]
production = [
    "gunicorn[gevent]==26.2.0",
    "sentry-sdk==2.71.0",
    "gevent==26.9.0",
]
dev = [
    "django-debug-toolbar==8.0.0",
    "ruff==0.16.10",
    "djhtml==3.0.11",
]

[tool.uv.sources]
dc-django-utils = { git = "https://github.com/DemocracyClub/dc_django_utils.git", tag = "8.0.5" }

[tool.uv]
package = false
required-version = "==0.11.*"
environments = [
    "platform_python_implementation == 'CPython'"
]

[tool.ruff]
line-length = 80
extend-exclude = ["lgsf_web/settings/local.py"]

[tool.ruff.lint]
ignore = ["E501"]
extend-select = [
    "I",
    "C4",
    "SIM",
    "Q003",
    "RET",
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["RUF012"]
