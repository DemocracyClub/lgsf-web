<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Summary: {{ council.name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" rel="stylesheet">
</head>
<body>
  <main class="container">
    <p><a href="{% url 'councillors:summary_list' %}">&laquo; All councils</a></p>
    <h1>Summary: {{ council.name }} ({{ council.code }})</h1>
    <p>
      {{ total }} scraped councillors.
    </p>
    <h3>
      Field Matching Statistics:
    </h3>
    {% include "councillors/includes/summary_stats_table.html" %}
    <h3>
      Councillor Data:
    </h3>
    <ul>
      <li><a href="{% url 'councillors:scraped_list' %}?council={{ council_id|urlencode }}">View Scraped Councillor Data</a></li>
      <li><a href="{% url 'councillors:compare_list' %}?council_id={{ council_id|urlencode }}">View Enriched Councillor Data</a></li>
    </ul>
  </main>
</body>
</html>
