<table>
  <thead>
    <tr><th>Fields</th><th>Matched</th><th>% of councillors</th><th>Missing</th></tr>
  </thead>
  <tbody>
    {% for stat in stats %}
      <tr>
        <td>{{ stat.label }}</td>
        <td>{{ stat.complete }} / {{ total }}</td>
        <td>{{ stat.percent }}%</td>
        <td><a href="{% url 'councillors:compare_list' %}?{% if council_id %}council_id={{ council_id|urlencode }}&{% endif %}{{ stat.filter_param }}=true">View missing</a></td>
      </tr>
    {% endfor %}
  </tbody>
</table>
