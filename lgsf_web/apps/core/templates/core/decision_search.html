<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Search Decisions</title>

    <!-- TODO: not this -->
    <link href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" rel="stylesheet">
</head>
<body>
    <main class="container">
        <h1>Search Decisions</h1>

        <form method="get">
            {{ form.q }}
            {{ form.council }}
            <button type="submit">Search</button>
        </form>

        {% if results %}
            <h2>{{ results.count }} Results</h2>
            {% for result in results %}
                {% include "core/snippets/inline_decision.html" with decision=result %}
            {% endfor %}
        {% endif %}
    </main>
</body>
</html>
