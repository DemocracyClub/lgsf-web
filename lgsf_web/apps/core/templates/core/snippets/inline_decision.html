<article>
    <h3><a href="{% url 'core:decision-detail' decision.pk %}">{{ decision.raw_title }}</a></h3>
    <dl>
      <dt>council</dt>
      <dd>{{ decision.council }}</dd>
      <dt>purpose</dt>
      <dd>{{ decision.purpose }}</dd>
      <dt>status</dt>
      <dd>{{ decision.status }}</dd>
    </dl>
    <footer>{{ decision.publication_date }}</footer>
</article>
