<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Decision makers</title>

    <!-- TODO: not this -->
    <link href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" rel="stylesheet">
</head>
<body>
    <main class="container">
        <h1>Decision makers</h1>

        <form method="get">
            <select name="council" onchange="this.form.submit()" aria-label="Council">
                <option value="">Select a council</option>
                {% for c in councils %}
                    <option value="{{ c.code }}"{% if c == council %} selected{% endif %}>{{ c.name }} ({{ c.code }})</option>
                {% endfor %}
            </select>
            <noscript><button type="submit">Show</button></noscript>
        </form>

        {% if council %}
            <table>
                <thead>
                    <tr>
                        <th>Decision maker</th>
                        <th>Decisions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for maker in makers %}
                        <tr>
                            <td>{{ maker.raw_decision_maker|default:"(blank)" }}</td>
                            <td>{{ maker.count }}</td>
                        </tr>
                    {% empty %}
                        <tr><td colspan="2">No decisions found.</td></tr>
                    {% endfor %}
                </tbody>
                {% if makers %}
                    <tfoot>
                        <tr>
                            <th>Total</th>
                            <th>{{ total }}</th>
                        </tr>
                    </tfoot>
                {% endif %}
            </table>
        {% endif %}
    </main>
</body>
</html>
